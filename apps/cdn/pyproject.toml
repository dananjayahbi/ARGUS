[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-cdn"
version = "0.1.0"
description = "ARGUS asset storage daemon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "sentry-sdk[fastapi]>=2.20,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx2>=2.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["argus_cdn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: exercises large uploads and is skipped in the default quick run",
]

[tool.ruff]
line-length = 100
target-version = "py311"
