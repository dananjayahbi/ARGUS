<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ARGUS</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="header">
      <div>
        <p class="eyebrow">ARGUS</p>
        <h1>QA capture</h1>
      </div>
      <button id="open-options" type="button" class="link">Settings</button>
    </header>

    <main class="main">
      <section class="card">
        <p id="status-text" class="status">Checking configuration…</p>
      </section>

      <section class="card">
        <h2>Capture</h2>
        <div class="actions">
          <button id="capture-area" type="button" class="primary" disabled>
            Area snip
          </button>
          <button id="capture-full" type="button" disabled>Full page</button>
          <button id="capture-text" type="button" disabled>
            Text-only report
          </button>
        </div>
        <p class="muted">
          Area snip and full page capture the active tab. Text-only creates a
          pending issue without a screenshot.
        </p>
      </section>

      <section class="card">
        <details id="text-report">
          <summary>Text-only report</summary>
          <div class="form">
            <label>
              Project
              <select id="text-project"></select>
            </label>

            <label>
              Title
              <input
                id="text-title"
                type="text"
                placeholder="Summarize the issue"
              />
            </label>

            <label>
              Description (Markdown)
              <textarea
                id="text-description"
                rows="4"
                placeholder="Steps to reproduce, expected vs actual…"
              ></textarea>
            </label>

            <label>
              Priority
              <span id="text-priority-label">50% · Medium / Functional Flaw</span>
              <input
                id="text-priority"
                type="range"
                min="0"
                max="100"
                step="1"
                value="50"
              />
            </label>

            <button id="text-submit" type="button" class="primary">
              Submit text-only report
            </button>
            <p id="text-status" class="status"></p>
            <div id="text-success" hidden></div>
          </div>
        </details>
      </section>

      <section class="card">
        <h2>Diagnostics</h2>
        <button id="harvest" type="button">Harvest now</button>
        <div id="diagnostics-preview" class="preview">
          <p class="muted">
            Open a page and harvest to preview its metadata and recent errors.
          </p>
        </div>
      </section>

      <section class="card">
        <h2>Last capture</h2>
        <div id="capture-preview" class="preview">
          <p class="muted">No capture yet.</p>
        </div>
        <div id="capture-actions" class="actions" hidden>
          <button id="use-capture" type="button" class="primary">
            Use this screenshot
          </button>
          <button id="discard-capture" type="button">Take another one</button>
        </div>
        <ol id="dispatch-steps" class="steps" hidden></ol>
        <p id="dispatch-status" class="status"></p>
      </section>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
