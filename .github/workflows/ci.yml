name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://argus:argus@127.0.0.1:5432/argus
      TEST_DATABASE_URL: postgresql://argus:argus@127.0.0.1:5432/argus_test
      WORKSPACE_TOKEN: ci-workspace-token-0123456789abcdef0123456789
      DRAFT_TOKEN_SECRET: ci-draft-token-secret-0123456789abcdef0123456789
      CDN_AUTH_TOKEN: ci-cdn-token-0123456789abcdef0123456789abcdef
      CDN_BASE_URL: http://127.0.0.1:8080
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789abcdef
      QA_EMAIL: qa@ci.local
      QA_PASSWORD: ci-qa-password
      DEVELOPER_EMAIL: dev@ci.local
      DEVELOPER_PASSWORD: ci-dev-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - run: npm run check:client-secrets

  cdn:
    name: CDN (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cdn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/cdn/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -m "not slow"

  e2e:
    name: E2E workflow gate (capture -> pending)
    runs-on: ubuntu-latest
    needs: [web, cdn]
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://argus:argus@127.0.0.1:5432/argus
      WORKSPACE_TOKEN: ci-workspace-token-0123456789abcdef0123456789
      DRAFT_TOKEN_SECRET: ci-draft-token-secret-0123456789abcdef0123456789
      CDN_AUTH_TOKEN: ci-cdn-token-0123456789abcdef0123456789abcdef
      CDN_BASE_URL: http://127.0.0.1:8080
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789abcdef
      QA_EMAIL: qa@ci.local
      QA_PASSWORD: ci-qa-password
      DEVELOPER_EMAIL: dev@ci.local
      DEVELOPER_PASSWORD: ci-dev-password
      PYTHON_BIN: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/cdn/pyproject.toml
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install CDN dependencies
        working-directory: apps/cdn
        run: python -m pip install -e ".[dev]"
      - name: Build web
        working-directory: apps/web
        run: npm run build
      - name: Run Workflow A end-to-end gate
        working-directory: apps/web
        run: npm run test:e2e
      - name: Run Workflow B end-to-end gate
        working-directory: apps/web
        run: npm run test:e2e:reconsider
      - name: Run capture-to-ticket performance budget
        working-directory: apps/web
        run: npm run test:perf
